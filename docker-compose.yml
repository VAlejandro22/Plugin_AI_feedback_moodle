version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: moodle-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: moodlerootpass
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - moodle-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  moodle:
    build: .
    container_name: moodle-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: mariadb
      MOODLE_DATABASE_NAME: moodle
      MOODLE_DATABASE_USER: moodleuser
      MOODLE_DATABASE_PASSWORD: moodlepass
      MOODLE_URL: http://localhost:8080
      MOODLE_ADMIN_USER: admin
      MOODLE_ADMIN_PASSWORD: Admin123!
      MOODLE_ADMIN_EMAIL: admin@example.com
    volumes:
      - moodle-data:/var/www/moodledata
      - ./plugin:/var/www/html/mod/assign/feedback/ai
    networks:
      - moodle-network

volumes:
  mariadb-data:
  moodle-data:

networks:
  moodle-network:
    driver: bridge
